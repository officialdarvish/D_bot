services:
  counter:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:9080:8080"
    volumes:
      - counter_data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  counter_data:
